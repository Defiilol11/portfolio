<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente sutil para simular el panel de cristal -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Fondo Dark Tech (#090a0c) -->
  <rect width="100" height="100" rx="22" fill="#090a0c" />
  
  <!-- Efecto Liquid Glass (borde superior más claro) -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#glass)" />
  <path d="M 22 2 L 78 2" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round" />
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- Monograma CT -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- C (Color Acento: #8fa5b2) -->
    <path d="M46 38 H34 V62 H46" stroke="#8fa5b2" />
    
    <!-- T (Blanco) -->
    <path d="M52 38 H70 M61 38 V62" stroke="#ffffff" />
  </g>
</svg>